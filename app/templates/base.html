<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Chest X-Ray Classifier{% endblock %}</title>
  <!-- NEW: Emoji Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫁</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>
  <header class="top-nav">
    <div class="logo">🫁 X-Ray AI</div>
    <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()"></button>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    function updateButtonText(theme) {
      toggleBtn.innerHTML = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    updateButtonText(document.documentElement.getAttribute('data-theme'));
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateButtonText(next);
    }
  </script>
</body>
</html>
